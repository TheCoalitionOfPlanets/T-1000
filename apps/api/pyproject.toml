[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t1000-api"
version = "0.1.0"
description = "Local voice generation and recognition API"
requires-python = ">=3.11"

# CPU and CUDA dependency profiles live in requirements/ at the repository root.
# Install a profile before installing this package with --no-deps.
[project.scripts]
t1000 = "t1000.api:main"
t1000-lab = "t1000.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
t1000 = ["static/*.js"]
