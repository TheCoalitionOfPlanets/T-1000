name: t1000-cpu

services:
  t1000:
    image: t1000:cpu
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    init: true
    ports:
      - "127.0.0.1:${T1000_PORT:-7860}:7860"
    environment:
      T1000_CONTAINER_DEVICE: cpu
      T1000_DOWNLOAD_MODELS: "${T1000_DOWNLOAD_MODELS:-1}"
      T1000_PRELOAD_MODELS: "${T1000_PRELOAD_MODELS:-1}"
      T1000_TTS_PROFILE: standard
      T1000_TTS_OPTIMIZE: "0"
      T1000_TTS_GPU_LAYERS: "0"
      STT_BACKEND: cpu
      STT_NUM_THREADS: "${STT_NUM_THREADS:-4}"
    volumes:
      - data:/app/data
      - cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 30m
      retries: 3
    stop_grace_period: 30s

volumes:
  data:
  cache:
